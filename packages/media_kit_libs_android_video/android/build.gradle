import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.security.MessageDigest

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.alexmercerind.media_kit_libs_android_video'
    compileSdkVersion 36
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    defaultConfig {
        minSdkVersion 16
    }
}

// The upstream default build disables pgssub. Pin the upstream full variant,
// which includes all subtitle decoders, while preserving its non-GPL build.
def nativeVersion = 'v1.1.8'
def nativeChecksums = [
    'arm64-v8a': '031aa9e76de6e0dea733d382252636f6237ded0aef797a561e6fc8b85c4f3ff1',
    'armeabi-v7a': 'e4875bb02d58f643950a5e0ac2d4862336fd7c0b47d65455cbc7a5ba41cfe522',
    'x86': '0d9a5b68c8bad247e24111673ca10ac645606e6eee308082241d7e90bc4015ea',
    'x86_64': 'ebb01a3b48c81ce78e5b7f44f89f68e30aaed169e54f7baa100e03830d4ed96f',
]
def nativeDirectory = layout.buildDirectory.dir("native-libraries/${nativeVersion}-full").get().asFile
def nativeJars = nativeChecksums.keySet().collect { abi ->
    new File(nativeDirectory, "full-${abi}.jar")
}
def sha256 = { File source ->
    def digest = MessageDigest.getInstance('SHA-256')
    source.withInputStream { input ->
        byte[] buffer = new byte[65536]
        int count
        while ((count = input.read(buffer)) != -1) {
            digest.update(buffer, 0, count)
        }
    }
    digest.digest().encodeHex().toString()
}

def prepareNativeLibraries = tasks.register('prepareNativeLibraries') {
    inputs.property('version', nativeVersion)
    inputs.property('checksums', nativeChecksums)
    outputs.files(nativeJars)
    doLast {
        nativeDirectory.mkdirs()
        nativeChecksums.each { abi, expectedDigest ->
            def destination = new File(nativeDirectory, "full-${abi}.jar")
            if (destination.exists() && sha256(destination) == expectedDigest) {
                return
            }
            def url = "https://github.com/media-kit/libmpv-android-video-build/releases/download/${nativeVersion}/full-${abi}.jar"
            def partial = new File(nativeDirectory, "full-${abi}.jar.part")
            try {
                logger.lifecycle("Downloading media_kit native library ${nativeVersion}/full-${abi}.jar")
                def connection = new URL(url).openConnection()
                connection.connectTimeout = 30000
                connection.readTimeout = 120000
                connection.getInputStream().withCloseable { input ->
                    partial.withOutputStream { output -> output << input }
                }
                if (sha256(partial) != expectedDigest) {
                    throw new GradleException("SHA-256 mismatch for ${url}")
                }
                Files.move(partial.toPath(), destination.toPath(), StandardCopyOption.REPLACE_EXISTING)
            } finally {
                partial.delete()
            }
        }
    }
}

dependencies {
    implementation files(nativeJars).builtBy(prepareNativeLibraries)
}
