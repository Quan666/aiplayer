import groovy.json.JsonSlurper
import java.nio.file.Files
import java.security.MessageDigest

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

def nativeApiValue = System.getenv('AIPLAYER_ANDROID_MIN_SDK') ?: '24'
if (!(nativeApiValue in ['23', '24'])) {
    throw new GradleException('AIPLAYER_ANDROID_MIN_SDK must be 23 or 24')
}
def nativeApi = nativeApiValue.toInteger()

android {
    namespace 'com.alexmercerind.media_kit_libs_android_video'
    compileSdkVersion 36
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    defaultConfig {
        minSdkVersion nativeApi
    }
}

// Pub's lockfile cannot authenticate downloads made by a native build script.
// Build the maintained FFmpeg source pin instead of the upstream FFmpeg 6.0 JARs.
def repositoryRoot = projectDir.parentFile.parentFile.parentFile
def sourceLock = new File(repositoryRoot, 'packages/media_kit_libs_android_video/native/sources.lock.json')
def recipe = new File(repositoryRoot, 'scripts/build_android_native.py')
def providedDirectory = System.getenv('AIPLAYER_ANDROID_NATIVE_DIR')
def nativeDirectory = providedDirectory
    ? new File(providedDirectory)
    : new File(repositoryRoot, nativeApi == 23
        ? '.local-build/native-player/artifacts-api23'
        : '.local-build/native-player/artifacts')
def targetAbis = [
    'android-arm': 'armeabi-v7a',
    'android-arm64': 'arm64-v8a',
    'android-x86': 'x86',
    'android-x64': 'x86_64',
]
def requestedTargets = project.findProperty('target-platform')?.toString()?.split(',')
def requiredAbis = requestedTargets
    ? requestedTargets.collect { target ->
        if (!targetAbis.containsKey(target)) {
            throw new GradleException("Unsupported Android target ${target}")
        }
        targetAbis[target]
    }.unique()
    : targetAbis.values().toList()
def nativeJars = requiredAbis.collect { abi -> new File(nativeDirectory, "full-${abi}.jar") }
def sha256 = { File source ->
    def digest = MessageDigest.getInstance('SHA-256')
    source.withInputStream { input ->
        byte[] buffer = new byte[65536]
        int count
        while ((count = input.read(buffer)) != -1) {
            digest.update(buffer, 0, count)
        }
    }
    digest.digest().encodeHex().toString()
}
def verifyNativeLibrary = { String abi ->
    def jar = new File(nativeDirectory, "full-${abi}.jar")
    def manifest = new File(nativeDirectory, "full-${abi}.json")
    if (Files.isSymbolicLink(jar.toPath()) || Files.isSymbolicLink(manifest.toPath())) return false
    if (!jar.isFile() || !manifest.isFile()) return false
    def metadata = new JsonSlurper().parse(manifest)
    metadata.abi == abi &&
        metadata.api == nativeApi &&
        metadata.sourcesLockSha256 == sha256(sourceLock) &&
        metadata.recipeSha256 == sha256(recipe) &&
        metadata.sha256 == sha256(jar)
}
def prepareNativeLibraries = tasks.register('prepareNativeLibraries') {
    inputs.files(sourceLock, recipe, fileTree(new File(sourceLock.parentFile, 'patches')))
    inputs.property('abis', requiredAbis)
    inputs.property('api', nativeApi)
    outputs.files(nativeJars)
    // Gradle's up-to-date state must never bypass validation of restored artifacts.
    outputs.upToDateWhen { false }
    doLast {
        def sourceMetadata = new JsonSlurper().parse(sourceLock)
        sourceMetadata.patches.each { name, expected ->
            if (sha256(new File(sourceLock.parentFile, "patches/${name}")) != expected) {
                throw new GradleException("Native patch hash mismatch: ${name}")
            }
        }
        nativeDirectory.mkdirs()
        requiredAbis.each { abi ->
            if (verifyNativeLibrary(abi)) return
            if (providedDirectory) {
                throw new GradleException("Unverified native library for ${abi}, API ${nativeApi} in AIPLAYER_ANDROID_NATIVE_DIR; rebuild it from the locked sources")
            }
            project.providers.exec {
                workingDir repositoryRoot
                commandLine 'python3', recipe.absolutePath, '--abi', abi, '--api', nativeApi.toString(), '--output', nativeDirectory.absolutePath
            }.result.get().assertNormalExitValue()
            if (!verifyNativeLibrary(abi)) {
                throw new GradleException("Native source build verification failed for ${abi}")
            }
        }
    }
}

dependencies {
    implementation files(nativeJars).builtBy(prepareNativeLibraries)
}
