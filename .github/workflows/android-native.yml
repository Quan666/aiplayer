name: Build Android native

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      fingerprint:
        description: Exact native inputs selected by the application build
        type: string
        default: ''
    outputs:
      fingerprint:
        value: ${{ jobs.probe.outputs.fingerprint }}

permissions:
  contents: read

# Application builds with identical native inputs share one producer. The
# queued caller probes again after the first has published; it does not compile.
concurrency:
  group: android-native-${{ inputs.fingerprint || github.ref }}
  # Keep waiting callers instead of replacing a pending dependency preparation.
  queue: max
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  probe:
    if: github.event_name != 'pull_request'
    name: Find exact native dependency version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
      fingerprint: ${{ steps.probe.outputs.fingerprint }}
      matrix: ${{ steps.probe.outputs.matrix }}
      runner: ${{ steps.probe.outputs.runner }}
      ndk: ${{ steps.probe.outputs.ndk }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check native registry and toolchain identity
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_FINGERPRINT: ${{ inputs.fingerprint }}
        run: python3 scripts/android_native_registry.py probe --fingerprint "$EXPECTED_FINGERPRINT" >> "$GITHUB_OUTPUT"

  build:
    needs: probe
    if: needs.probe.outputs.ready != 'true'
    name: Native API ${{ matrix.api }} · ${{ matrix.abi }}
    runs-on: ${{ needs.probe.outputs.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.probe.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the declared native build environment
        env:
          NDK_VERSION: ${{ needs.probe.outputs.ndk }}
        run: |
          python3 scripts/android_native_registry.py install-tools
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          printf 'ANDROID_NDK_HOME=%s/ndk/%s\n' "$ANDROID_HOME" "$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Cache only source archives (rehash before extraction)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/native-sources
          key: native-sources-${{ hashFiles('packages/media_kit_libs_android_video/native/sources.lock.json') }}
      - name: Compile and verify this API and ABI from locked sources
        env:
          NATIVE_API: ${{ matrix.api }}
          NATIVE_ABI: ${{ matrix.abi }}
        run: |
          jobs=$(python3 -c 'import json, os; print(min(os.cpu_count() or 2, json.load(open("packages/media_kit_libs_android_video/native/toolchain.json"))["max_jobs"]))')
          python3 scripts/build_android_native.py --api "$NATIVE_API" --abi "$NATIVE_ABI" --output "$RUNNER_TEMP/native-libs" --cache-dir "$RUNNER_TEMP/native-sources" --jobs "$jobs"
          python3 scripts/android_native_registry.py pack --directory "$RUNNER_TEMP/native-libs" --output "$RUNNER_TEMP/native-bundles" --api "$NATIVE_API" --abi "$NATIVE_ABI"
      - name: Transfer verified bundle to isolated dependency publisher
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: internal-native-api${{ matrix.api }}-${{ matrix.abi }}
          path: ${{ runner.temp }}/native-bundles/*.zip
          overwrite: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: [probe, build]
    if: needs.probe.outputs.ready != 'true'
    name: Publish complete native dependency version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # Also serialize manual and automatic producers for the same fingerprint.
    concurrency:
      group: publish-android-native-${{ needs.probe.outputs.fingerprint }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: internal-native-*
          path: ${{ runner.temp }}/native-bundles
          merge-multiple: true
      # This job does not run native dependencies and receives no Android key.
      - name: Verify all five bundles, then publish without replacing an existing version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/android_native_registry.py publish --directory "$RUNNER_TEMP/native-bundles"

  finish:
    needs: [probe, build, publish]
    if: always() && github.event_name != 'pull_request' && needs.probe.outputs.ready != 'true'
    name: Finish native dependency preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Remove temporary native transfers from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.name | startswith("internal-native-")) | .id' > "$RUNNER_TEMP/native-artifact-ids"
          while read -r artifact_id; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done < "$RUNNER_TEMP/native-artifact-ids"
      - name: Require either a reused dependency or a complete new publication
        env:
          PROBE_RESULT: ${{ needs.probe.result }}
          REUSED: ${{ needs.probe.outputs.ready }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          test "$PROBE_RESULT" = success
          if [ "$REUSED" != true ]; then
            test "$BUILD_RESULT" = success
            test "$PUBLISH_RESULT" = success
          fi
