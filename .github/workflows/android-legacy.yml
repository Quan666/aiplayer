name: Build Android 6 compatibility

# Compatibility builds are explicitly requested and do not gate modern releases.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-legacy-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  native_android:
    name: Android 6 native libraries (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install native build tools and the pinned NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build nasm autoconf automake libtool pkg-config cmake build-essential patch
          sdkmanager 'ndk;28.2.13676358'
          printf 'ANDROID_NDK_HOME=%s/ndk/28.2.13676358\n' "$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Cache source downloads that the recipe verifies again
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/native-sources
          key: native-sources-${{ hashFiles('packages/media_kit_libs_android_video/native/sources.lock.json') }}
      - name: Build API 23 native libraries from the verified source lock
        env:
          NATIVE_ABI: ${{ matrix.abi }}
        run: python3 scripts/build_android_native.py --api 23 --abi "$NATIVE_ABI" --output "$RUNNER_TEMP/native-libs-api23" --cache-dir "$RUNNER_TEMP/native-sources" --jobs 2
      - name: Transfer the native library and source metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-android-legacy-${{ matrix.abi }}
          path: ${{ runner.temp }}/native-libs-api23/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  android_build:
    needs: native_android
    name: Android 6 build (ARM32 + ARM64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Build tools and dependencies never receive the persistent signing key.
      AIPLAYER_ANDROID_UNSIGNED: 'true'
      AIPLAYER_ANDROID_MIN_SDK: '23'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Install the pinned Android build platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Download API 23 native libraries from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: native-android-legacy-*
          path: ${{ runner.temp }}/native-libs-api23
          merge-multiple: true
      - name: Prepare the isolated compatibility source and dependency locks
        run: python3 scripts/prepare_android_legacy.py --output "$RUNNER_TEMP/android6-source"
      - name: Resolve the reviewed compatibility dependencies
        working-directory: ${{ runner.temp }}/android6-source/client
        run: flutter pub get --enforce-lockfile
      - name: Build both ARM architectures without the signing key
        working-directory: ${{ runner.temp }}/android6-source/client
        env:
          AIPLAYER_ANDROID_NATIVE_DIR: ${{ runner.temp }}/native-libs-api23
        run: flutter build apk --release --target-platform android-arm,android-arm64
      - name: Transfer unsigned APK to a fresh signing runner
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ runner.temp }}/android6-source/client/build/app/outputs/flutter-apk/app-release.apk
          archive: false
          if-no-files-found: error
          retention-days: 1

  android_sign:
    needs: android_build
    name: Android 6 sign and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download only the current unsigned build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: app-release.apk
          path: ${{ runner.temp }}/unsigned-apk
          skip-decompress: true
      # This runner never executes Flutter, Gradle or APK-provided code.
      - name: Sign with the existing certificate and validate API 23 and both ARM ABIs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: python3 scripts/sign_android_apk.py --input-dir "$RUNNER_TEMP/unsigned-apk" --abi universal --android-legacy
      # The signing script deletes its key before artifact code runs.
      - name: Upload the Android 6 compatibility APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: artifacts/aiplayer-*-android-legacy.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
