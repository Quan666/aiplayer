  macos:
    needs: validate
    if: inputs.target == '' || inputs.target == 'all' || inputs.target == 'macos'
    name: macOS universal (Apple Silicon + Intel)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      COCOAPODS_DISABLE_STATS: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Show build tools
        run: |
          flutter --version
          xcodebuild -version
          pod --version
      - name: Build and package for personal use
        run: bash scripts/package_macos.sh --app-only
      - name: Upload macOS app ZIP
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/aiplayer-macos-unsigned.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Download instructions
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### macOS 自用包
          在本次运行的 Artifacts 中下载 `aiplayer-macos-unsigned.zip`，
          解压一次即得到 `aiplayer.app`，将其拖到 Applications。
          `.app` 是目录包，使用 ZIP 传输以保留可执行权限和符号链接。

          包含 Apple Silicon / Intel 架构；仅上传这一份应用包。
          使用 ad-hoc 签名，未经 Apple 公证；首次运行可能需要在
          「系统设置 → 隐私与安全性」中允许打开。
          自用构建不启用 App Sandbox，凭据保存在应用数据目录中的本地文件，
          不再访问钥匙串或因读取凭据弹出钥匙串授权窗口。
          凭据文件未加密，仅允许当前用户读写（文件 `0600`，所在目录 `0700`）。
          从旧自用包升级后需重新填写同步 Token；已同步的凭据可从加密同步记录恢复，
          未同步的凭据需重新填写。旧钥匙串条目保留，程序不会读取或迁移这些条目。
          CI 打包通过不代表播放、网络来源和本地凭据读写已完成实机验收。
          EOF

  release:
    name: Publish GitHub Release
    needs: [validate, android, macos]
    if: >-
      !cancelled() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.validate.result == 'success' &&
      (needs.android.result == 'success' || needs.android.result == 'skipped') &&
      (needs.macos.result == 'success' || needs.macos.result == 'skipped') &&
      (needs.android.result == 'success' || needs.macos.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download packages from this run
        uses: actions/download-artifact@v8
        with:
          pattern: aiplayer-*
          path: release-assets
          merge-multiple: true
          # APKs and the macOS ZIP are already packaged; keep their bytes intact.
          skip-decompress: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TARGET: ${{ inputs.target || 'all' }}
        run: python3 scripts/publish_release.py --tag "$GITHUB_REF_NAME" --target "$RELEASE_TARGET" --artifacts release-assets
