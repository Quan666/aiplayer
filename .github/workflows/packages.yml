name: Build packages

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform to package
        type: choice
        default: all
        options:
          - all # Android + macOS only for now.
          - android
          # - windows
          # - linux
          # - ios
          - macos
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'client/**'
      - 'packages/**'
      - 'scripts/**'
      - 'signing/android-certificate.sha256'
      - '.github/workflows/packages.yml'
  pull_request:
    paths:
      - 'client/**'
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/packages.yml'

permissions:
  contents: read

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}-${{ inputs.target || 'automatic' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Match the release tag to the source version
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/publish_release.py --tag "$GITHUB_REF_NAME" --check-only

  android:
    needs: validate
    # Never pass the persistent signing key to pull request code.
    if: github.event_name != 'pull_request' && (inputs.target == '' || inputs.target == 'all' || inputs.target == 'android')
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: [universal, arm64]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore and verify the existing Android key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          AIPLAYER_ANDROID_KEYSTORE: ${{ runner.temp }}/aiplayer-signing/debug.keystore
        run: |
          printf 'AIPLAYER_ANDROID_KEYSTORE=%s\n' "$AIPLAYER_ANDROID_KEYSTORE" >> "$GITHUB_ENV"
          python3 scripts/restore_android_signing.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: client
      - name: Build and validate APK
        run: python3 scripts/package.py android --android-abi "${{ matrix.abi }}" --no-android-alias
      # One APK per ABI; do not upload aliases or separate reports.
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/aiplayer-*-android*.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Remove restored signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/aiplayer-signing/debug.keystore"

