name: Build packages

on:
  workflow_dispatch:
    inputs:
      target:
        description: 安装包（Android 包含通用、ARM64、Android 6 兼容版）
        type: choice
        default: all
        options: [all, android, android-legacy, macos]
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'client/**'
      - 'packages/**'
      - 'compat/android6/**'
      - 'scripts/**'
      - 'signing/android-certificate.sha256'
      - '.github/workflows/packages.yml'
  pull_request:
    paths:
      - 'client/**'
      - 'packages/**'
      - 'compat/android6/**'
      - 'scripts/**'
      - 'signing/android-certificate.sha256'
      - '.github/workflows/packages.yml'

permissions:
  contents: read

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}-${{ inputs.target || 'automatic' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  validate:
    name: Validate build plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      android_profiles: ${{ steps.plan.outputs.android_profiles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check pins and packaging regressions before expensive builds
        run: |
          python3 scripts/check_supply_chain.py
          python3 -B -m unittest discover -s scripts/tests -p 'test_ci_packages.py'
          python3 -B -m unittest discover -s scripts/tests -p 'test_publish_release.py'
      - name: Match the release tag to the source version
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/publish_release.py --tag "$GITHUB_REF_NAME" --check-only
      - name: Select only requested Android profiles
        id: plan
        env:
          PACKAGE_TARGET: ${{ inputs.target || 'all' }}
        run: python3 scripts/ci_packages.py plan --target "$PACKAGE_TARGET"

  android_build:
    needs: validate
    if: github.event_name != 'pull_request' && inputs.target != 'macos'
    name: Android dependencies + build (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.android_profiles) }}
    env:
      # Native dependencies, Flutter and Gradle share this runner; no signing key.
      AIPLAYER_ANDROID_UNSIGNED: 'true'
      AIPLAYER_ANDROID_MIN_SDK: ${{ matrix.api }}
      AIPLAYER_ANDROID_NATIVE_DIR: ${{ github.workspace }}/.ci/native-${{ matrix.api }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
          cache: true
      - name: Cache verified native JARs (exact recipe + API, no fallback key)
        id: native_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ci/native-${{ matrix.api }}
          key: native-v1-${{ runner.os }}-${{ runner.arch }}-api${{ matrix.api }}-${{ hashFiles('packages/media_kit_libs_android_video/native/**', 'scripts/build_android_native.py', 'scripts/verify_android_native.py', '.github/workflows/packages.yml') }}
      - name: Check every cached ABI before reuse
        id: native
        env:
          NATIVE_ABIS: ${{ matrix.abis }}
        run: |
          missing=false
          for abi in $NATIVE_ABIS; do
            if ! python3 scripts/verify_android_native.py --api "$AIPLAYER_ANDROID_MIN_SDK" --abi "$abi" --directory "$AIPLAYER_ANDROID_NATIVE_DIR"; then
              missing=true
            fi
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
      - name: Cache source archives (rehash before extraction)
        if: steps.native.outputs.missing == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/native-sources
          key: native-sources-${{ hashFiles('packages/media_kit_libs_android_video/native/sources.lock.json') }}
      - name: Cache locked Gradle downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ runner.arch }}-${{ matrix.profile }}-${{ hashFiles('client/android/**/*.gradle*', 'client/android/gradle/**', 'compat/android6/**') }}
      - name: Install Android build platform and pinned NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          printf 'ANDROID_NDK_HOME=%s/ndk/28.2.13676358\n' "$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Install native build tools only on cache misses
        if: steps.native.outputs.missing == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build nasm autoconf automake libtool pkg-config cmake build-essential patch
      - name: Build only missing native ABIs on this runner
        if: steps.native.outputs.missing == 'true'
        env:
          NATIVE_ABIS: ${{ matrix.abis }}
        run: |
          for abi in $NATIVE_ABIS; do
            if ! python3 scripts/verify_android_native.py --api "$AIPLAYER_ANDROID_MIN_SDK" --abi "$abi" --directory "$AIPLAYER_ANDROID_NATIVE_DIR"; then
              python3 scripts/build_android_native.py --api "$AIPLAYER_ANDROID_MIN_SDK" --abi "$abi" --output "$AIPLAYER_ANDROID_NATIVE_DIR" --cache-dir "$RUNNER_TEMP/native-sources" --jobs "$(nproc)"
              python3 scripts/verify_android_native.py --api "$AIPLAYER_ANDROID_MIN_SDK" --abi "$abi" --directory "$AIPLAYER_ANDROID_NATIVE_DIR"
            fi
          done
      - name: Save verified native results before Flutter builds
        if: steps.native_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ci/native-${{ matrix.api }}
          key: ${{ steps.native_cache.outputs.cache-primary-key }}
      - name: Build modern APKs sequentially with one Flutter and Gradle workspace
        if: matrix.profile == 'modern'
        run: |
          bash scripts/build_release.sh android
          bash scripts/build_release.sh android-arm64
      - name: Build Android 6.0 / 6.0.1 APK with the pinned legacy engine
        if: matrix.profile == 'legacy'
        run: bash scripts/build_release.sh android-legacy
      - name: Transfer unsigned APKs to the isolated signer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: internal-unsigned-${{ matrix.profile }}
          overwrite: true
          path: ${{ runner.temp }}/unsigned-apks/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  android:
    needs: [validate, android_build]
    if: github.event_name != 'pull_request' && inputs.target != 'macos'
    name: Sign and validate Android packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download unsigned packages from this build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: internal-unsigned-*
          path: ${{ runner.temp }}/unsigned-apks
          merge-multiple: true
      # No Flutter, Gradle, native build or dependency cache on the signer.
      - name: Sign each requested APK with the existing certificate
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PACKAGE_TARGET: ${{ inputs.target || 'all' }}
        run: python3 scripts/ci_packages.py sign --target "$PACKAGE_TARGET" --directory "$RUNNER_TEMP/unsigned-apks"
      - name: Upload Android universal · Android 7+ · ARM32 + ARM64 + x86_64
        if: inputs.target != 'android-legacy'
        id: universal
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: artifacts/aiplayer-*-android.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android ARM64 · Android 7+ · smaller download
        if: inputs.target != 'android-legacy'
        id: arm64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: artifacts/aiplayer-*-android-arm64.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android legacy · Android 6.0 / 6.0.1+ · ARM32 + ARM64
        id: legacy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: artifacts/aiplayer-*-android-legacy.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Describe packages, direct downloads and checksums
        env:
          PACKAGE_TARGET: ${{ inputs.target || 'all' }}
          UNIVERSAL_URL: ${{ steps.universal.outputs.artifact-url }}
          ARM64_URL: ${{ steps.arm64.outputs.artifact-url }}
          LEGACY_URL: ${{ steps.legacy.outputs.artifact-url }}
        run: python3 scripts/ci_packages.py summary --target "$PACKAGE_TARGET" --directory artifacts

  cleanup:
    name: Remove intermediate transfers
    needs: [android_build, android]
    if: always() && github.event_name != 'pull_request' && inputs.target != 'macos'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # Enumerate only this run, including prior attempts, after all consumers end.
      - name: Remove internal artifacts even when building or signing failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.name | startswith("internal-unsigned-")) | .id' > "$RUNNER_TEMP/internal-artifact-ids"
          while read -r artifact_id; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done < "$RUNNER_TEMP/internal-artifact-ids"

  macos:
    needs: validate
    if: inputs.target == '' || inputs.target == 'all' || inputs.target == 'macos'
    name: macOS universal · Apple Silicon + Intel
    runs-on: macos-15
    timeout-minutes: 60
    env:
      COCOAPODS_DISABLE_STATS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Cache CocoaPods downloads and dependency resolution
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
            client/macos/Podfile.lock
          key: pods-${{ runner.os }}-${{ runner.arch }}-flutter-3.47.7-${{ hashFiles('client/pubspec.lock', 'client/macos/Podfile', 'packages/**/*.podspec') }}
      - name: Build and verify both architectures and ad-hoc signature
        run: bash scripts/build_release.sh macos
      - name: Upload macOS app ZIP
        id: macos
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: artifacts/aiplayer-macos-unsigned.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Describe download, installation and checksum
        env:
          MACOS_URL: ${{ steps.macos.outputs.artifact-url }}
        run: python3 scripts/ci_packages.py summary --target macos --directory artifacts

  release:
    name: Publish GitHub Release
    needs: [validate, android, macos, cleanup]
    if: >-
      !cancelled() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.validate.result == 'success' &&
      (needs.android.result == 'success' || needs.android.result == 'skipped') &&
      (needs.macos.result == 'success' || needs.macos.result == 'skipped') &&
      (needs.cleanup.result == 'success' || needs.cleanup.result == 'skipped') &&
      (needs.android.result == 'success' || needs.macos.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download only final packages from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: aiplayer-*
          path: release-assets
          merge-multiple: true
          skip-decompress: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TARGET: ${{ inputs.target || 'all' }}
        run: python3 scripts/publish_release.py --tag "$GITHUB_REF_NAME" --target "$RELEASE_TARGET" --artifacts release-assets
